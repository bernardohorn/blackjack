<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-label="Como jogar"><defs>
<radialGradient id="feltro" cx="50%" cy="42%" r="80%"><stop stop-color="#155640"/><stop offset="1" stop-color="#062A22"/></radialGradient>
<linearGradient id="ouro" x2="0.8" y2="1"><stop stop-color="#F1D991"/><stop offset="1" stop-color="#D7B25F"/></linearGradient>
<pattern id="trama" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 1 L5 1 M1 0 L1 5" stroke="#91B89C" stroke-opacity=".035"/></pattern>
<pattern id="verso" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M6 0 L12 6 L6 12 L0 6 Z" fill="none" stroke="#BFA362" stroke-opacity=".27"/></pattern>
</defs><rect x="0" y="0" width="390" height="844" rx="0" fill="url(#feltro)"/><rect x="0" y="0" width="390" height="844" rx="0" fill="url(#trama)"/><text x="26" y="33" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="start">9:41</text><text x="364" y="33" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="end">▮▮▮  ◔  ▰</text><rect x="24" y="65" width="44" height="44" rx="15" fill="#19463B"/><text x="46" y="94" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle">‹</text><text x="82" y="94" fill="#F7F1E4" font-family="Georgia, serif" font-size="24" font-weight="600" text-anchor="start">Como jogar</text><text x="24" y="132" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Poucas regras. Muitas boas decisões.</text><rect x="24" y="165" width="342" height="103" rx="18" fill="#164439" stroke="#386354"/><text x="42" y="194" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">01  Chegue perto de 21</text><text x="42" y="219" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Vença a banca com mais pontos,</text><text x="42" y="239" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">sem ultrapassar 21. Empate não é derrota.</text><rect x="24" y="281" width="342" height="103" rx="18" fill="#164439" stroke="#386354"/><text x="42" y="310" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">02  Conheça as cartas</text><text x="42" y="335" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">2 a 10 valem o número da carta.</text><text x="42" y="355" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">J, Q e K valem 10. O Ás vale 1 ou 11.</text><g transform="rotate(0 75.0 441.0)"><rect x="47" y="405" width="56" height="80" rx="12" fill="#031F19"/><rect x="47" y="401" width="56" height="80" rx="12" fill="#F7F1E4" stroke="#DFD8C9"/><text x="53.22222222222222" y="416.38461538461536" fill="#233B32" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">A</text><text x="53.22222222222222" y="428.0769230769231" fill="#233B32" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♠</text><text x="75.0" y="450.9555555555556" fill="#233B32" font-family="Georgia, serif" font-size="26.755555555555556" font-weight="400" text-anchor="middle">♠</text><g transform="rotate(180 75.0 441.0)"><text x="53.22222222222222" y="416.38461538461536" fill="#233B32" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">A</text><text x="53.22222222222222" y="428.0769230769231" fill="#233B32" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♠</text></g></g><g transform="rotate(0 117.0 441.0)"><rect x="89" y="405" width="56" height="80" rx="12" fill="#031F19"/><rect x="89" y="401" width="56" height="80" rx="12" fill="#F7F1E4" stroke="#DFD8C9"/><text x="95.22222222222223" y="416.38461538461536" fill="#AB3A40" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">9</text><text x="95.22222222222223" y="428.0769230769231" fill="#AB3A40" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♥</text><text x="117.0" y="450.9555555555556" fill="#AB3A40" font-family="Georgia, serif" font-size="26.755555555555556" font-weight="400" text-anchor="middle">♥</text><g transform="rotate(180 117.0 441.0)"><text x="95.22222222222223" y="416.38461538461536" fill="#AB3A40" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">9</text><text x="95.22222222222223" y="428.0769230769231" fill="#AB3A40" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♥</text></g></g><g transform="rotate(0 159.0 441.0)"><rect x="131" y="405" width="56" height="80" rx="12" fill="#031F19"/><rect x="131" y="401" width="56" height="80" rx="12" fill="#F7F1E4" stroke="#DFD8C9"/><text x="137.22222222222223" y="416.38461538461536" fill="#AB3A40" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">A</text><text x="137.22222222222223" y="428.0769230769231" fill="#AB3A40" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♦</text><text x="159.0" y="450.9555555555556" fill="#AB3A40" font-family="Georgia, serif" font-size="26.755555555555556" font-weight="400" text-anchor="middle">♦</text><g transform="rotate(180 159.0 441.0)"><text x="137.22222222222223" y="416.38461538461536" fill="#AB3A40" font-family="Segoe UI, Arial, sans-serif" font-size="12.444444444444445" font-weight="700" text-anchor="start">A</text><text x="137.22222222222223" y="428.0769230769231" fill="#AB3A40" font-family="Georgia, serif" font-size="11.2" font-weight="400" text-anchor="start">♦</text></g></g><text x="217" y="431" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start">A + 9 + A = 21</text><text x="217" y="454" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Um Ás vale 11;</text><text x="217" y="473" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">o outro vale 1.</text><rect x="24" y="501" width="342" height="103" rx="18" fill="#164439" stroke="#386354"/><text x="42" y="530" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">03  Escolha sua ação</text><text x="42" y="555" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Pedir carta (Hit): recebe mais uma carta.</text><text x="42" y="575" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Parar (Stand): encerra sua vez.</text><rect x="24" y="617" width="342" height="139" rx="18" fill="#164439" stroke="#386354"/><text x="42" y="646" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">04  A vez da banca</text><text x="42" y="671" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Compra abaixo de 17; para a partir de 17.</text><text x="42" y="691" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Soft 17 segue a configuração da mesa.</text><text x="42" y="711" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Ás + figura em 2 cartas é Blackjack.</text><text x="42" y="731" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Dois Blackjacks naturais: empate.</text><text x="195" y="790" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Modo de estudo · sem apostas</text><rect x="137" y="823" width="116" height="4" rx="2" fill="#90A89A"/></svg>