ans-serif" font-size="20" font-weight="600" text-anchor="middle">+</text><rect x="24" y="288" width="342" height="102" rx="18" fill="#164439" stroke="#386354"/><text x="42" y="320" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Banca para no soft 17</text><text x="42" y="345" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Ás + 6 = 17, com Ás valendo 11.</text><text x="42" y="364" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Ligado: a banca para nessa mão.</text><rect x="300" y="310" width="48" height="28" rx="14" fill="#E8C778"/><circle cx="334" cy="324" r="10" fill="#173B30"/><text x="24" y="431" fill="#E8C778" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="650" text-anchor="start" letter-spacing="1.4">PREFERÊNCIAS</text><rect x="24" y="449" width="342" height="55" rx="16" fill="#164439" stroke="#386354"/><text x="42" y="483" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Som</text><rect x="300" y="463" width="48" height="28" rx="14" fill="#E8C778"/><circle cx="334" cy="477" r="10" fill="#173B30"/><rect x="24" y="516" width="342" height="55" rx="16" fill="#164439" stroke="#386354"/><text x="42" y="550" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Vibração</text><rect x="300" y="530" width="48" height="28" rx="14" fill="#E8C778"/><circle cx="334" cy="544" r="10" fill="#173B30"/><rect x="24" y="583" width="342" height="74" rx="16" fill="#164439" stroke="#386354"/><text x="42" y="626" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Tema</text><rect x="218" y="600" width="72" height="40" rx="12" fill="#E8C778"/><text x="254" y="625" fill="#092F27" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" text-anchor="middle">Escuro</text><text x="326" y="625" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Claro</text><text x="195" y="694" fill="#B6CDC2" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">As regras atuais da mesa são preservadas.</text><rect x="24" y="719" width="342" height="54" rx="17" fill="#092F27" stroke="#BDA466"/><text x="195.0" y="752" fill="#F7F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Restaurar padrões</text><rect x="137" y="823" width="116" height="4" rx="2" fill="#90A89A"/></svg>